Screens:
  Screen3:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      Height: =Max(App.Height, App.DesignHeight)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      Width: =Max(App.Width, App.DesignWidth)
    Children:
      - icon1_2:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            DisabledFill: =icon1_2.Fill
            FocusedBorderColor: =icon1_2.BorderColor
            Height: =50
            HoverBorderColor: =ColorFade(icon1_2.BorderColor, 20%)
            HoverColor: =ColorFade(icon1_2.Color, 20%)
            HoverFill: =icon1_2.Fill
            Icon: =Icon.NextArrow
            OnSelect: =Navigate(Screen4, BorderStyle.None)
            PressedBorderColor: =ColorFade(icon1_2.BorderColor, -20%)
            PressedColor: =ColorFade(icon1_2.Color, -20%)
            PressedFill: =icon1_2.Fill
            Width: =50
            X: =1280
            Y: =40
      - icon2_1:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            DisabledFill: =icon2_1.Fill
            FocusedBorderColor: =icon2_1.BorderColor
            Height: =50
            HoverBorderColor: =ColorFade(icon2_1.BorderColor, 20%)
            HoverColor: =ColorFade(icon2_1.Color, 20%)
            HoverFill: =icon2_1.Fill
            Icon: =Icon.BackArrow
            OnSelect: =Back()
            PressedBorderColor: =ColorFade(icon2_1.BorderColor, -20%)
            PressedColor: =ColorFade(icon2_1.Color, -20%)
            PressedFill: =icon2_1.Fill
            Width: =50
            X: =40
            Y: =40
