Screens:
  Screen1:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      Height: =Max(App.Height, App.DesignHeight)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      Width: =Max(App.Width, App.DesignWidth)
    Children:
      - Chart_2:
          Control: CanvasComponent
          ComponentName: Chart
          Properties:
            Colors: =["#31825d", "#30a667", "#5ec16c", "#f6c790", "#f7c772", "#f7b45b", "#f68f64", "#d46068", "#946eb0", "#769acc", "#60c5ea"]
            Data: |-
              ={
                  legends: ["Test 1", "Test 1"],
                  labels: ["Label 1","Label 2","Label 3","Label 4","Label 5"],
                  table: Table(
                      {key:"values", values:[90, 20, 40, 80, 50]}
                  )
              }
            Height: =500
            Legend: |-
              ={
                  enabled: true,
                  source: "labels",
                  placement: "bottom",
                  width: 100,
                  height: 45,
                  itemGap: 5,
                  fontSize: 14,
                  fontFamily: "",
                  fontWeight: "bold",
                  fontStyle: "normal",
                  color: "#666666",
                  align: "center"
              }
            Options: |-
              =Table(
                  {key:"pie.radius", value:"0,95"},
              {key:"pie.dataLabels", value:"true"}
              )
            Subtitle: |-
              ={
                  text: "Subtitle",
                  height: 12,
                  align: "center",
                  paddingTop: 12,
                  fontSize: 12,
                  fontFamily: "",
                  fontWeight: "bold",
                  fontStyle: "normal",
                  color: "#808080",
                  additionalStyles: ""
              }
            Title: |-
              ={
                  text: "Title",
                  height: 20,
                  align: "center",
                  paddingTop: 10,
                  fontSize: 20,
                  fontFamily: "",
                  fontWeight: "bold",
                  fontStyle: "normal",
                  color: "#666666",
                  additionalStyles: ""
              }
            Type: =glbType
            Width: =455
            X: =40
            Y: =140
      - btnApplyPieType:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(btnApplyPieType.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            FocusedBorderColor: =btnApplyPieType.BorderColor
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(btnApplyPieType.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =Set(glbType, "Pie")
            PressedBorderColor: =btnApplyPieType.Fill
            PressedColor: =btnApplyPieType.Fill
            PressedFill: =btnApplyPieType.Color
            Text: ="Pie"
            Width: =81
            X: =40
            Y: =40
      - btnApplyFunnelType:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(btnApplyFunnelType.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            FocusedBorderColor: =btnApplyFunnelType.BorderColor
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(btnApplyFunnelType.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =Set(glbType, "Funnel")
            PressedBorderColor: =btnApplyFunnelType.Fill
            PressedColor: =btnApplyFunnelType.Fill
            PressedFill: =btnApplyFunnelType.Color
            Text: ="Funnel"
            Width: =81
            X: =144
            Y: =40
      - Chart_3:
          Control: CanvasComponent
          ComponentName: Chart
          Properties:
            Colors: =["#31825d", "#30a667", "#5ec16c", "#f6c790", "#f7c772", "#f7b45b", "#f68f64", "#d46068", "#946eb0", "#769acc", "#60c5ea"]
