                                          "fill='" & yAxis.style.lineColor & "' " & 
                                          "stroke-width='" & Text(yAxis.style.lineWidth, "#0.000", "en-us") & "' " &
                                          "stroke='" & yAxis.style.lineColor & "'/>" &
                                      "<g>" &
                                          "<g transform='translate(" & If(yAxis.align = "left", Text(yAxis.style.width, "#0.000", "en-us"), 0) & "," & Text(Round(plot.y + plot.height,3), "#0.000", "en-us") & ")'>" &
