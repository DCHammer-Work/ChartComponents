                                          })
                                      }),
                                      min:If(yAxis.max <> yAxis.min,yAxis.min,stacked,0,RoundDown(Min(data,Min(values,Value)) - Max((Max(data,Max(values,Value)) - Min(data,Min(values,Value))) / 10,10),0)),
                                      max:If(yAxis.max <> yAxis.min,yAxis.max,stacked,Max(ForAll(RenameColumns(FirstN(indexes,CountRows(labels)),index,i),{Value:Sum(data, Last(FirstN(values,i)).Value)}),Value),RoundUp(Max(data,Max(values,Value)),0)),
                                      tickX:Round(If(yAxis.align = "left", -yAxis.style.tickLength, yAxis.style.tickLength),3),
                                      labelX:Round(If(yAxis.align = "left",-yAxis.style.tickLength-5,yAxis.style.tickLength + 5),3),
                                      labelAnchor:If(yAxis.align = "left","end","start")
                                  }),step,If(yAxis.step = 0,RoundUp((max - min) / 5,0),yAxis.step)),
                                  //X Axis
                                  "<style>" &
                                      ".x-labels{fill:"& xAxis.labels.color &";font-size:" & Text(xAxis.labels.fontSize, "#0.000", "en-us") & "px;font-family:'" & xAxis.labels.fontFamily & "';font-weight:" & xAxis.labels.fontWeight & ";font-style:" & xAxis.labels.fontStyle & ";" & xAxis.labels.additionalStyles & "}"&
                                      ".y-labels{fill:"& yAxis.labels.color &";font-size:" & Text(yAxis.labels.fontSize, "#0.000", "en-us") & "px;font-family:'" & yAxis.labels.fontFamily & "';font-weight:" & yAxis.labels.fontWeight & ";font-style:" & yAxis.labels.fontStyle & ";" & yAxis.labels.additionalStyles & "}"&
                                  "</style>" &
                                  If(xAxis.enabled,"<g class='x-axis' transform='translate(" & Text(plot.x, "#0.000", "en-us") & "," & Text(Round(plot.y + plot.height,3), "#0.000", "en-us") & ")'>" &
                                      "<path d='M0,0H" & Text(Round(plot.x + plot.width,3), "#0.000", "en-us") & "'  "&
