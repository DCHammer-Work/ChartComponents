                                              If(xAxis.labels.enabled, "<text transform='rotate(" & Text(xAxis.labels.rotation, "#0.000", "en-us") & ",0,5)' class='x-labels' dy='1em' y='5' text-anchor='"& If(xAxis.labels.rotation > 0,"start",xAxis.labels.rotation < 0,"end", "middle") & "' x='0'>" &
