                                      color:Last(FirstN(colors,index)).color,
                                      values:ForAll(LookUp(Chart.Data.table, key=index & ".y").values,{Value:Round(Value(Value),3)})
                                  }),
                                  labels:ForAll(FirstN(indexes,CountRows(labels)),{
