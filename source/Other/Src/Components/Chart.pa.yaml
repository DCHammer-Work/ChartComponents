                                                  "font-family:" & yAxis.titleStyle.fontFamily & ";" &
                                                  "font-weight:" & yAxis.titleStyle.fontWeight & ";" &
                                                  "font-style:" & yAxis.titleStyle.fontStyle & ";" & yAxis.titleStyle.additionalStyles & "'>" &
                                              yAxis.title &
                                          "</text>") &
                                          "<path transform='translate(" & Text(Round(If(yAxis.align = "left", yAxis.style.width, 0),3), "#0.000", "en-us") & ",0)' d='M0,0L3,10L-3,10L0,0V" & Text(Round(plot.y + plot.height,3), "#0.000", "en-us") & "'  "&
                                              "fill='" & yAxis.style.lineColor & "' " & 
                                              "stroke-width='" & Text(yAxis.style.lineWidth, "#0.000", "en-us") & "' " &
                                              "stroke='" & yAxis.style.lineColor & "'/>" &
                                          "<g>" &
                                              "<g transform='translate(" & If(yAxis.align = "left", Text(yAxis.style.width, "#0.000", "en-us"), 0) & "," & Text(Round(plot.y + plot.height,3), "#0.000", "en-us") & ")'>" &
                                                  "<path d='M0,0H" & Text(tickX, "#0.000", "en-us") & "' stroke-width='" & Text(xAxis.style.tickWidth, "#0.000", "en-us") & "' stroke='" & yAxis.style.lineColor & "'/>" &
                                                  If(yAxis.labels.enabled,
                                                  "<text class='y-labels' dy='.5em' y='-5' text-anchor='"& labelAnchor & "' x='"& Text(labelX, "#0.000", "en-us") & "'>" &
                                                      Text(minY, yAxis.labels.format) &
                                                  "</text>") &
                                              "</g>" &
                                              Concat(ForAll(Filter(indexes, index <= RoundUp((maxY - minY) / stepY,0)),{
                                                  y:Round(plot.y + (plot.height) * (1 - stepY * index / (maxY - minY)),3),
                                                  label:Text(minY + index * stepY, yAxis.labels.format)
                                              }),
                                              "<g transform='translate(" & If(yAxis.align = "left", Text(yAxis.style.width, "#0.000", "en-us"), 0) & "," & Text(y, "#0.000", "en-us") & ")'>" &
                                                  "<path d='M0,0H" & Text(tickX, "#0.000", "en-us") & "' stroke-width='" & Text(yAxis.style.tickWidth, "#0.000", "en-us") & "' stroke='" & yAxis.style.lineColor & "'/>" &
                                                  If(yAxis.labels.enabled,
                                                  "<text class='y-labels' dy='.5em' y='-5' text-anchor='"& labelAnchor & "' x='"& Text(labelX, "#0.000", "en-us") & "'>" &
                                                      label &
                                                  "</text>") &
                                              "</g>") &
                                          "</g>" &
                                      "</g>") &
                                      "<g transform='translate("&Text(plot.x, "#0.000", "en-us")&","&Text(Round(plot.y+plot.height,3), "#0.000", "en-us")&")'>" &
                                          Concat(Sort(ForAll(data,{
                                              id:id,
                                              color:color,
                                              borderColor:Coalesce(style.borderColor,color),
                                              points:AddColumns(values,
                                                  xPos,Round(plot.width * (x - minX) / (maxX - minX),3),
                                                  yPos,Round(plot.height * (y - minY) / (minY - maxY),3),
                                                  radius,Round((z-minZ) / (maxZ - minZ) * (style.maxSize - style.minSize) + style.minSize / 2,3)
                                              )
                                          }),id,SortOrder.Descending),
                                              "<g fill='"& color &"' " &
                                                  "stroke='"& borderColor &"' " &
                                                  "stroke-width='"& Text(style.borderWidth, "#0.000", "en-us") &"' " &
                                                  "fill-opacity='"& Text(style.fillOpacity, "#0.000", "en-us") &"'>" &
                                              Concat(points,
                                                  "<circle data-z='" & Text(z, "#0.000", "en-us") & "' data-min='" & Text(minZ, "#0.000", "en-us") & "' data-max='" & Text(maxZ, "#0.000", "en-us") & "' data-max-size='" & Text(style.maxSize, "#0.000", "en-us") & "' data-min-size='" & Text(style.minSize, "#0.000", "en-us") & "' cx='" & Text(xPos, "#0.000", "en-us") & "' " &
                                                      "cy='" & Text(yPos, "#0.000", "en-us") & "' " &
                                                      "r='" & Text(radius, "#0.000", "en-us") & "'/>") &
                                              "</g>"
                                          ) &
                                      "</g>"
                                      )
                                  )
                              ),
                          "</svg>"
                      ),
                      "%", "%25"), "<", "%3C"), ">", "%3E"), "#", "%23"), "{", "%7B"), "}", "%7D")
              ))
            PressedBorderColor: =ColorFade(Scatter.BorderColor, -20%)
            PressedFill: =ColorFade(Scatter.Fill, -20%)
            Width: =PlotArea.Width
            X: =PlotArea.X
            Y: =PlotArea.Y
      - Bar:
