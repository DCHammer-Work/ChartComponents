                                          "text-anchor='" & If(yAxis.titleStyle.align = "left","end","start") & "' " &
                                          "x='" & Text(Round(If(yAxis.align="left",yAxis.style.width,0) + If(yAxis.titleStyle.align = "left",-10,10),3), "#0.000", "en-us") & "' " &
