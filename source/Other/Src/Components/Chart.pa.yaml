                                                          "H"& Text(x + offsetX + barWidth, "#0.000", "en-us") &
                                                          "V"& Text(baseY, "#0.000", "en-us") &"' " & 
                                                      "stroke='" & borderColor & "' " & 
                                                      "stroke-width='" & Text(style.borderWidth, "#0.000", "en-us") & "'/>") &
                                              "</g>"
                                          ) &
                                      "</g>"
                                      )
                                  )
                              ),
                          "</svg>"
                      ),
                      "%", "%25"), "<", "%3C"), ">", "%3E"), "#", "%23"), "{", "%7B"), "}", "%7D")
              ))
            Width: =PlotArea.Width
            X: =PlotArea.X
            Y: =PlotArea.Y
      - BarHoriz:
          Control: Image@2.2.3
