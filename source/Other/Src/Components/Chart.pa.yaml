                                      height:Round(height - If(xAxis.enabled,xAxis.style.height,0) - If(yAxis.enabled,yAxis.style.padTop,0),3)
                                  }
                              }),
                                  Concat(AddColumns(Table({
                                      data:ForAll(data,{
