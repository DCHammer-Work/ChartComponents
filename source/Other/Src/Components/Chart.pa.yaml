                                                          "H" & Text(LookUp(RenameColumns(data,index,id),id = index + 1).x, "#0.000", "en-us") & "Z' " &
                                                      "fill='" & d.color & "' " &
                                                      "fill-opacity='" & Text(connectorOpacity, "#0.000", "en-us") & "' stroke-width='0' fill-rule='evenodd'></path>") &
                                                  If(orientation = "horizontal",
                                                      "<text class='data-label' transform='rotate(90," & Text(Round((x + x1) / 2,3), "#0.000", "en-us") & "," & Text(Round((y+y2)/2,3), "#0.000", "en-us") & ")' " &
                                                          "x='"& Text(Round((x + x1) / 2,3), "#0.000", "en-us") &"' "&
                                                          "y='" & Text(Round((y+y2)/2,3), "#0.000", "en-us") & "' "&
                                                          "dy='" & Text(Round((labelStyle.fontSize - dataStyle.fontSize - percentageStyle.fontSize - dataStyle.dy - percentageStyle.dy)/2,3), "#0.000", "en-us") & "' "&
                                                          "text-anchor='middle'>" &
                                                          If(labelStyle.enabled,d.label) &
                                                          If(dataStyle.enabled," <tspan class='value-label' " &
                                                              "x='"& Text(Round((x + x1) / 2,3), "#0.000", "en-us") &"' "&
                                                              "dy='"& Text(Round(dataStyle.fontSize+dataStyle.dy,3), "#0.000", "en-us") &"'>" &
                                                              Text(d.value, dataStyle.format) &
                                                          "</tspan>") &
                                                          If(percentageStyle.enabled," <tspan class='percentage-label' " &
                                                              "x='" & Text(Round((x + x1) / 2,3), "#0.000", "en-us") &"' "&
                                                              "dy='"& Text(Round(percentageStyle.fontSize+percentageStyle.dy,3), "#0.000", "en-us") &"'>" &
                                                              Text(percentage, "#0.000", "en-us") &
                                                          "</tspan>") &
                                                      "</text>",
                                                      "<text class='data-label' " &
                                                          "x='"& Text(Switch(labelStyle.align,"left",x + 5,"right",x1 - 5,Round((x + x1) / 2,3)), "#0.000", "en-us") &"' "&
                                                          "y='" & Text(Switch(labelStyle.verticalAlign,"top",y + 5,"bottom",y2 - 5,Round((y+y2)/2,3)), "#0.000", "en-us") & "' "&
                                                          "text-anchor='" & Switch(labelStyle.align,"left","start","right","end","middle") & "' " &
                                                          "dy='" & Switch(labelStyle.verticalAlign,"top","0.8em","bottom","0","0.4em") & "'>" &
                                                          If(labelStyle.enabled,d.label) &
                                                          If(dataStyle.enabled," <tspan class='value-label' " &
                                                              "dx='"& Text(dataStyle.dx, "#0.000", "en-us") &"' " &
                                                              "dy='"& Text(dataStyle.dy, "#0.000", "en-us") &"'>" &
                                                              Text(d.value, dataStyle.format) &
                                                          "</tspan>") &
                                                          If(percentageStyle.enabled," <tspan class='percentage-label' " &
                                                              "dx='"& Text(percentageStyle.dx, "#0.000", "en-us") &"' " &
                                                              "dy='"& Text(percentageStyle.dy, "#0.000", "en-us") &"'>" &
                                                              Text(percentage, "#0.000", "en-us") &
                                                          "</tspan>") &
                                                      "</text>"
                                                  )
                                              )
                                      )) &
                                  "</g>"
                              ))),
                          "</svg>"
                      ),
                      "%", "%25"), "<", "%3C"), ">", "%3E"), "#", "%23"), "{", "%7B"), "}", "%7D")
              ))
            PressedBorderColor: =ColorFade(Funnel.BorderColor, -20%)
            PressedFill: =ColorFade(Funnel.Fill, -20%)
            Width: =PlotArea.Width
            X: =PlotArea.X
