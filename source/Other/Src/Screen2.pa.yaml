Screens:
  Screen2:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      Height: =Max(App.Height, App.DesignHeight)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      Width: =Max(App.Width, App.DesignWidth)
    Children:
      - Chart_1:
          Control: CanvasComponent
          ComponentName: Chart
          Properties:
            Colors: =["#31825d", "#30a667", "#5ec16c", "#f6c790", "#f7c772", "#f7b45b", "#f68f64", "#d46068", "#946eb0", "#769acc", "#60c5ea"]
            Data: |-
              ={
                  legends: ["Test 1", "Test 2", "Test 3"],
                  labels: ["Label 1",  "Label 2",  "Label 3",  "Label 4",  "Label 5",  "Label 6",  "Label 7",  "Label 8"],
                  table: Table(
                      {key:"1.y", values:[120, 132, 101, 134, 90, 230, 210, 101]},
                      {key:"2.y", values:[220, 182, 191, 234, 290, 330, 310, 182]},
                      {key:"3.y", values:[150, 232, 201, 154, 190, 330, 410, 190]}
                  )
              }
            Height: =500
            Legend: |-
              ={
                  enabled: true,
                  source: "legends",
                  placement: "bottom",
                  width: 100,
                  height: 45,
                  itemGap: 5,
                  fontSize: 14,
                  fontFamily: "",
                  fontWeight: "bold",
                  fontStyle: "normal",
                  color: "#666666",
                  align: "center"
              }
            Options: |-
              =Table(
                  {key:"",value:""},{key:"pie.dataLabels", value:"true"}
              )
            Subtitle: |-
              ={
                  text: "Subtitle",
                  height: 12,
                  align: "center",
                  paddingTop: 12,
                  fontSize: 12,
                  fontFamily: "",
                  fontWeight: "bold",
                  fontStyle: "normal",
                  color: "#808080",
                  additionalStyles: ""
              }
            Title: |-
              ={
                  text: "Title",
                  height: 20,
                  align: "center",
                  paddingTop: 10,
                  fontSize: 20,
                  fontFamily: "",
                  fontWeight: "bold",
                  fontStyle: "normal",
                  color: "#666666",
                  additionalStyles: ""
              }
            Type: ="Line"
            Width: =400
            X: =28
            Y: =171
