Screens:
  Screen5:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      Height: =Max(App.Height, App.DesignHeight)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      Width: =Max(App.Width, App.DesignWidth)
    Children:
      - Chart_9:
          Control: CanvasComponent
          ComponentName: Chart
          Properties:
            Colors: =["#31825d", "#30a667", "#5ec16c", "#f6c790", "#f7c772", "#f7b45b", "#f68f64", "#d46068", "#946eb0", "#769acc", "#60c5ea"]
            Data: |-
              ={
                  legends: ["Test 1", "Test 1"],
                  labels: ["Label 1","Label 2","Label 3","Label 4","Label 5"],
                  table: Table(
                      {key:"values", values:[90, 20, 40, 80, 50]}
                  )
              }
            Height: =500
            Legend: |-
              ={
                  enabled: true,
                  source: "labels",
                  placement: "bottom",
                  width: 100,
                  height: 45,
                  itemGap: 5,
                  fontSize: 14,
                  fontFamily: "",
                  fontWeight: "bold",
                  fontStyle: "normal",
                  color: "#666666",
                  align: "center"
              }
            Options: |-
              =Table(
                  {key:"",value:""},{key:"pie.dataLabels", value:"true"}
              )
            Subtitle: |-
              ={
                  text: "Subtitle",
                  height: 12,
                  align: "center",
                  paddingTop: 12,
                  fontSize: 12,
                  fontFamily: "",
                  fontWeight: "bold",
                  fontStyle: "normal",
                  color: "#808080",
                  additionalStyles: ""
              }
            Title: |-
              ={
                  text: "Title",
                  height: 20,
                  align: "center",
                  paddingTop: 10,
                  fontSize: 20,
                  fontFamily: "",
                  fontWeight: "bold",
                  fontStyle: "normal",
                  color: "#666666",
                  additionalStyles: ""
              }
            Type: ="BarHoriz"
            Width: =500
